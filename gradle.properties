# Obrigatorio: o classpath deste modulo (CameraX, ML Kit, Lifecycle) depende
# de bibliotecas AndroidX. Sem esta flag o AGP recusa compilar.
android.useAndroidX=true

# O AGP 8.7.3 foi testado ate compileSdk 35; usamos compileSdk 36
# deliberadamente (ver build.gradle.kts). Isso silencia o warning
# "We recommend using a newer Android Gradle plugin" ate atualizarmos
# o AGP para uma versao que ja tenha sido testada com compileSdk 36.
android.suppressUnsupportedCompileSdk=36

# Versao publicada de todos os modulos (com.scannervciarfid:<modulo>).
# Mantenha igual a "version" do pubspec.yaml do plugin Flutter.
VERSION_NAME=0.1.0

# Com varios modulos, o lint e o R8 rodam no mesmo daemon. O Metaspace
# padrao (256 MB) estoura ("Metaspace") no lintVitalAnalyzeRelease.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
