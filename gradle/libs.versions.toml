# Versoes compartilhadas por todos os modulos nativos. As pontes MAUI e
# Flutter dependem destas mesmas versoes: ao mudar CameraX, ML Kit ou
# Lifecycle aqui, atualize tambem os PackageReference da binding .NET
# (dotnet/ScannerVcIaRfid.Android.Binding).
[versions]
agp = "9.3.1"
camerax = "1.6.1"
mlkit-barcode = "17.3.0"
mlkit-text-recognition = "16.0.1"
gms-code-scanner = "16.1.0"
mlkit-language-id = "17.0.6"
mlkit-translate = "17.0.3"
mlkit-entity-extraction = "16.0.0-beta6"
lifecycle = "2.11.0"
androidx-core = "1.13.1"
androidx-activity = "1.9.3"
junit = "4.13.2"
androidx-test-junit = "1.3.0"

[libraries]
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text-recognition" }
gms-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "gms-code-scanner" }
mlkit-language-id = { module = "com.google.mlkit:language-id", version.ref = "mlkit-language-id" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkit-translate" }
mlkit-entity-extraction = { module = "com.google.mlkit:entity-extraction", version.ref = "mlkit-entity-extraction" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
