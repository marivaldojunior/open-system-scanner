name: scanner_vc_ia_rfid_nfc
description: >
  Plugin Flutter para o modulo nativo nfc da scanner-vc-ia-rfid (Android) -
  leitura de tags NFC/RFID HF (UID, tecnologias e registros NDEF) com o
  Reader Mode do Android.
version: 0.1.0
homepage:

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.scannervciarfid.flutter.nfc
        pluginClass: ScannerVcIaRfidNfcPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
