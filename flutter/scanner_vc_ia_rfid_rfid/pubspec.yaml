name: scanner_vc_ia_rfid_rfid
description: >
  Plugin Flutter para o modulo nativo rfid da scanner-vc-ia-rfid (Android) -
  inventario de tags RFID UHF (EPC Gen2) em lotes, hoje pelo DataWedge
  da Zebra.
version: 0.1.0
homepage:

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.scannervciarfid.flutter.rfid
        pluginClass: ScannerVcIaRfidRfidPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
