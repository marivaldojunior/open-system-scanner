group 'com.scannervciarfid.flutter.rfid'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        // O .aar do nucleo e CameraX 1.6 / Lifecycle 2.11 sao compilados com
        // Kotlin 2.2 - um compilador Kotlin 1.9 recusa ler esses metadados.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'
    }
}

// Repositorio Maven gerado por `./gradlew publish` na raiz do repositorio
// (build/maven-repo). Para usar outro repositorio (ex.: GitHub Packages
// ou um diretorio fora do clone), defina a propriedade Gradle
// scannerVcIaRfidMavenRepo no gradle.properties do app.
def scannerVcIaRfidMavenRepo = project.findProperty('scannerVcIaRfidMavenRepo') ?:
        file("${projectDir}/../../../build/maven-repo").toURI()

// O repositorio vai para todos os projetos, nao so para o plugin: o modulo
// :app tambem resolve os .aar (classpath de runtime). Declarado so no
// plugin, o build do app falha com "Could not find com.scannervciarfid:...".
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url scannerVcIaRfidMavenRepo
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Opcional: leitor pelo SDK Zebra RFID API3 (modulo rfid-zebra), com RSSI e
// sem DataWedge. Ative com scannerVcIaRfidZebraApi3=true no gradle.properties
// do app. O SDK exige minSdk 29, e o app adiciona o .aar do SDK (licenca da
// Zebra) - ver README, secao RFID UHF.
def zebraApi3Enabled = (project.findProperty('scannerVcIaRfidZebraApi3') ?: 'false').toString().toBoolean()

android {
    namespace 'com.scannervciarfid.flutter.rfid'
    compileSdk 36

    defaultConfig {
        minSdk zebraApi3Enabled ? 29 : 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Mantenha igual a VERSION_NAME do gradle.properties na raiz do repositorio.
def scannerVcIaRfidVersion = '0.1.0'

dependencies {
    // O POM do modulo rfid lista as proprias dependencias - nao repita aqui.
    implementation "com.scannervciarfid:rfid:$scannerVcIaRfidVersion"

    // O RfidReaderFactory encontra o leitor API3 por reflection: nenhuma
    // mudanca no codigo do plugin.
    if (zebraApi3Enabled) {
        implementation "com.scannervciarfid:rfid-zebra:$scannerVcIaRfidVersion"
    }
}
