name: scanner_vc_ia_rfid_vision_extras_example
description: App de exemplo do plugin scanner_vc_ia_rfid_vision_extras.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # O VisionScannerWidget vem do plugin principal; este plugin so registra
  # os motores extras.
  scanner_vc_ia_rfid_flutter:
    path: ../../scanner_vc_ia_rfid_flutter
  scanner_vc_ia_rfid_vision_extras:
    path: ../
  # Verifique a versao mais recente em pub.dev antes de instalar.
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
