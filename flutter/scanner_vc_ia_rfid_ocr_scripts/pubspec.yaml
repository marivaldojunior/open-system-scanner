name: scanner_vc_ia_rfid_ocr_scripts
description: >
  Complemento do plugin scanner_vc_ia_rfid_flutter - registra motores de OCR
  em chines, japones, coreano e devanagari para o VisionScannerWidget.
version: 0.1.0
homepage:

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.scannervciarfid.flutter.ocrscripts
        pluginClass: ScannerVcIaRfidOcrScriptsPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
