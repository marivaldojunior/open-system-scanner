group 'com.scannervciarfid.flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        // O .aar do nucleo e CameraX 1.6 / Lifecycle 2.11 sao compilados com
        // Kotlin 2.2 - um compilador Kotlin 1.9 recusa ler esses metadados.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.scannervciarfid.flutter'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Torna visiveis os .aar/.jar soltos em android/libs - eh ai que deve ir o
// scanner-vc-ia-rfid-release.aar gerado pelo modulo nativo (Etapas 1-5).
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // name = nome do arquivo sem extensao (libs/scanner-vc-ia-rfid-release.aar)
    implementation(name: 'scanner-vc-ia-rfid-release', ext: 'aar')

    // O .aar do nucleo nativo NAO embarca CameraX/ML Kit (foram declarados
    // como "implementation" no build.gradle.kts dele, nao "api"), entao o
    // consumidor final - este plugin - precisa repeti-los aqui, com as
    // mesmas versoes usadas la (build.gradle.kts na raiz do repositorio).
    // Versao menor que a do nucleo pode gerar NoSuchMethodError em runtime.
    implementation 'androidx.camera:camera-core:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Sem esta dependencia, DataCaptureFactory falha com NoClassDefFoundError
    // ao criar o OcrTextEngine (CaptureMode.CAMERA_VISION).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
}
