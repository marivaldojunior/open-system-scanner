group 'com.opensystemscanner.flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.opensystemscanner.flutter'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Torna visiveis os .aar/.jar soltos em android/libs - eh ai que deve ir o
// opensystemscanner-release.aar gerado pelo modulo nativo (Etapas 1-5).
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // name = nome do arquivo sem extensao (libs/opensystemscanner-release.aar)
    implementation(name: 'opensystemscanner-release', ext: 'aar')

    // O .aar do nucleo nativo NAO embarca CameraX/ML Kit (foram declarados
    // como "implementation" no build.gradle.kts dele, nao "api"), entao o
    // consumidor final - este plugin - precisa repeti-los aqui, com as
    // mesmas versoes usadas la.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
}
